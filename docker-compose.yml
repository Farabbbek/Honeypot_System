# ============================================================
# Adaptive Honeypot System — Production (VPS 159.89.103.231)
# ============================================================

services:

  # ==========================================================
  # PostgreSQL (internal only)
  # ==========================================================
  postgres:
    image: postgres:16
    container_name: honeypot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: honeypot
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honeypot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - honeypot-net

  # ==========================================================
  # Redis (internal only)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: honeypot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - honeypot-net

  # ==========================================================
  # Cowrie SSH Honeypot
  # ==========================================================
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    environment:
      COWRIE_LLM_API_KEY: ${DEEPSEEK_API_KEY:-}
      COWRIE_LLM_HOST: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      COWRIE_LLM_PATH: /v1/chat/completions
      COWRIE_LLM_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      COWRIE_LLM_MAX_TOKENS: 350
      COWRIE_LLM_TEMPERATURE: 0.3
    ports:
      - "2222:2222"
    volumes:
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
      - cowrie_honeyfs:/cowrie/cowrie-git/var/lib/cowrie
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./cowrie/honeyfs:/cowrie/cowrie-git/honeyfs:rw
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - honeypot-net

  # ==========================================================
  # FastAPI Backend
  # ==========================================================
  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: honeypot-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:strongpassword123@postgres:5432/honeypot
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: cowrie:events
      COWRIE_JSON_LOG: /var/log/cowrie/cowrie.json
      COWRIE_HONEYFS_ROOT: /opt/cowrie/honeyfs
      REPORT_OUTPUT_DIR: /app/reports
      ALLOWED_ORIGINS: "http://159.89.103.231:3001,http://159.89.103.231"
      DASHBOARD_URL: http://159.89.103.231
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-enabled}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEOIP_CITY_DB: /app/geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /app/geoip/GeoLite2-ASN.mmdb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cowrie:
        condition: service_started
    volumes:
      - cowrie_logs:/var/log/cowrie
      - ./cowrie/honeyfs:/opt/cowrie/honeyfs:rw
      - reports_data:/app/reports
      - ./geoip:/app/geoip:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - honeypot-net

  # ==========================================================
  # Collector (log tailing & ingestion)
  # ==========================================================
  collector:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: honeypot-collector
    restart: unless-stopped
    command: ["python", "collector.py"]
    environment:
      DATABASE_URL: postgresql://postgres:strongpassword123@postgres:5432/honeypot
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: cowrie:events
      COWRIE_JSON_LOG: /var/log/cowrie/cowrie.json
      COWRIE_HONEYFS_ROOT: /opt/cowrie/honeyfs
      REPORT_OUTPUT_DIR: /app/reports
      DASHBOARD_URL: http://159.89.103.231
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-enabled}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GEOIP_CITY_DB: /app/geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /app/geoip/GeoLite2-ASN.mmdb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cowrie:
        condition: service_started
    volumes:
      - cowrie_logs:/var/log/cowrie
      - ./cowrie/honeyfs:/opt/cowrie/honeyfs:rw
      - reports_data:/app/reports
      - ./geoip:/app/geoip:ro
    networks:
      - honeypot-net

  # ==========================================================
  # Next.js Frontend Dashboard
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://159.89.103.231:8000
        NEXT_PUBLIC_WS_URL: ws://159.89.103.231:8000
    container_name: honeypot-dashboard
    restart: unless-stopped
    environment:
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://159.89.103.231:8000
      NEXT_PUBLIC_WS_URL: ws://159.89.103.231:8000
    ports:
      - "3001:3001"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - honeypot-net

volumes:
  cowrie_logs:
  cowrie_honeyfs:
  postgres_data:
  redis_data:
  reports_data:

networks:
  honeypot-net:
    driver: bridge