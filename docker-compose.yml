# ============================================================
# Adaptive Honeypot System — Production (DigitalOcean VPS)
# Deploy:  docker compose up -d --build
# ============================================================

services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:16
    container_name: honeypot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honeypot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepass123}
      POSTGRES_DB: ${POSTGRES_DB:-honeypot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeypot} -d ${POSTGRES_DB:-honeypot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================
  # Redis (for event streaming & caching)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: honeypot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # Cowrie SSH Honeypot (from Docker Hub)
  # ==========================================================
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    environment:
      COWRIE_LLM_API_KEY: ${DEEPSEEK_API_KEY:-}
      COWRIE_LLM_HOST: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      COWRIE_LLM_PATH: /v1/chat/completions
      COWRIE_LLM_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      COWRIE_LLM_MAX_TOKENS: 350
      COWRIE_LLM_TEMPERATURE: 0.3
    ports:
      - "2222:2222"
    volumes:
      - cowrie_logs:/home/cowrie/cowrie/log
      - cowrie_downloads:/home/cowrie/cowrie/dl
      - ./cowrie/cowrie.cfg:/home/cowrie/cowrie/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/home/cowrie/cowrie/etc/userdb.txt:ro
      - ./cowrie/honeyfs:/home/cowrie/cowrie/honeyfs:ro
    depends_on:
      redis:
        condition: service_healthy

  # ==========================================================
  # FastAPI Backend
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: honeypot-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-honeypot}:${POSTGRES_PASSWORD:-securepass123}@postgres:5432/${POSTGRES_DB:-honeypot}
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: cowrie:events
      COWRIE_JSON_LOG: /var/log/cowrie/cowrie.json
      COWRIE_HONEYFS_ROOT: /opt/cowrie/honeyfs
      REPORT_OUTPUT_DIR: /app/reports
      GEOIP_CITY_DB: /app/geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /app/geoip/GeoLite2-ASN.mmdb
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-enabled}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://167.71.54.188}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - cowrie_logs:/var/log/cowrie
      - cowrie_downloads:/opt/cowrie/dl
      - ./backend/reports:/app/reports
      - ./geoip:/app/geoip:ro
      - ./cowrie/honeyfs:/opt/cowrie/honeyfs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================
  # Collector (log tailing & ingestion)
  # ==========================================================
  collector:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: honeypot-collector
    restart: unless-stopped
    command: ["python", "collector.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-honeypot}:${POSTGRES_PASSWORD:-securepass123}@postgres:5432/${POSTGRES_DB:-honeypot}
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: ${REDIS_STREAM:-cowrie:events}
      COWRIE_JSON_LOG: /var/log/cowrie/cowrie.json
      COWRIE_HONEYFS_ROOT: /opt/cowrie/honeyfs
      REPORT_OUTPUT_DIR: /app/reports
      GEOIP_CITY_DB: /app/geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /app/geoip/GeoLite2-ASN.mmdb
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-enabled}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://167.71.54.188}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cowrie:
        condition: service_started
    volumes:
      - cowrie_logs:/var/log/cowrie
      - cowrie_downloads:/opt/cowrie/dl
      - ./backend/reports:/app/reports
      - ./geoip:/app/geoip:ro
      - ./cowrie/honeyfs:/opt/cowrie/honeyfs:ro

  # ==========================================================
  # Next.js Frontend Dashboard
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: honeypot-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: ${DASHBOARD_URL:-http://167.71.54.188}/api
      NEXT_PUBLIC_WS_URL: ws://167.71.54.188/ws/alerts
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      backend:
        condition: service_healthy

  # ==========================================================
  # Nginx Reverse Proxy
  # ==========================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: honeypot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" # резерв для будущего SSL
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  cowrie_logs:
  cowrie_downloads: