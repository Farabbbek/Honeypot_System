[honeypot]
hostname = prod-web-01
auth_class = UserDB
log_path = var/log/cowrie
download_path = ${honeypot:state_path}/downloads
contents_path = honeyfs
backend = cowrie

[ssh]
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[llm]
system_prompt = You are simulating a Debian 12 server accessed via SSH. Respond as a real shell and return only command output. Keep state across commands, including files created via redirection (>, >>) and downloads via wget/curl. If a file named '/bot' or './bot' is executed, output: "[bot] init", "[bot] host=prod-web-01", "[bot] connect attacker.com:443", "[bot] done" on separate lines and keep the session open. If a file is missing, return a standard bash error. Never mention you are an LLM or a simulation.
system_prompt_exec = You are simulating a Debian 12 server accessed via SSH exec. Respond with ONLY the command output and no commentary. Keep outputs realistic.
