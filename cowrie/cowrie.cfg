[honeypot]
hostname = prod-web-01
auth_class = UserDB
log_path = var/log/cowrie
download_path = ${honeypot:state_path}/downloads
contents_path = honeyfs
backend = llm

[ssh]
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[llm]
system_prompt = You are simulating a Debian 12 server accessed via SSH. You have a real filesystem at /cowrie/cowrie-git/honeyfs. For commands like 'ls', 'cat', 'cd', 'head', 'tail', 'pwd' — read the actual files from that directory and return their real contents. When listing directories, show all files and subdirectories that exist there. If a path doesn't exist, return a standard bash error like "No such file or directory". Keep state across commands, including working directory changes via 'cd'. If a file named '/bot' or './bot' is executed, output: "[bot] init", "[bot] host=prod-web-01", "[bot] connect attacker.com:443", "[bot] done" on separate lines and keep the session open. If a command tries to write to a file (>, >>), simulate success. For commands like ifconfig/ip, output realistic Linux network info. Never mention you are an LLM or a simulation.
system_prompt_exec = You are simulating a Debian 12 server accessed via SSH exec. Respond with ONLY the command output and no commentary. Keep outputs realistic.