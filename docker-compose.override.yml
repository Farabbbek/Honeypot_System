services:
  postgres:
    ports: !override []

  redis:
    ports: !override []

  collector:
    healthcheck:
      disable: true

  server:
    ports: !override []
    expose:
      - "8000"

  frontend:
    ports: !override []
    expose:
      - "3001"
    build:
      args:
        NEXT_PUBLIC_API_URL: http://159.89.103.231
        NEXT_PUBLIC_WS_URL: ws://159.89.103.231/ws/alerts
    environment:
      NEXT_PUBLIC_API_URL: http://159.89.103.231
      NEXT_PUBLIC_WS_URL: ws://159.89.103.231/ws/alerts

  nginx:
    image: nginx:alpine
    container_name: honeypot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - frontend
    networks:
      - honeypot-net